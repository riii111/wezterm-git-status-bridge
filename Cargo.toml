[package]
name = "wezterm-git-status-bridge"
version = "0.3.5"
edition = "2024"
rust-version = "1.96"
description = "Bridge Git repository status into WezTerm status rendering"
license = "MIT"
repository = "https://github.com/riii111/wezterm-git-status-bridge"
readme = "README.md"
keywords = ["wezterm", "git", "status", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
# Groups
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Pedantic suppressions
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
doc_markdown = "allow"
similar_names = "allow"
too_many_lines = "allow"
items_after_statements = "allow"
needless_pass_by_value = "allow"
match_wildcard_for_single_variants = "allow"
struct_field_names = "allow"

# Nursery suppressions
missing_const_for_fn = "allow"
significant_drop_tightening = "allow"
option_if_let_else = "allow"
branches_sharing_code = "allow"

# Restriction lints
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
allow_attributes_without_reason = "deny"

[profile.release]
lto = true
codegen-units = 1
